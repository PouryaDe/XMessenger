version: '3.8'

services:
  xmessenger:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: xmessenger-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DEFAULT_TTL_SECONDS=${DEFAULT_TTL_SECONDS:-86400}
    volumes:
      - xmessenger-data:/app/data
    networks:
      - xmessenger-net

  nginx:
    image: nginx:alpine
    container_name: xmessenger-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - xmessenger
    networks:
      - xmessenger-net

  certbot:
    image: certbot/certbot
    container_name: xmessenger-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - xmessenger-net

volumes:
  xmessenger-data:
    driver: local

networks:
  xmessenger-net:
    driver: bridge
