  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('xmessenger_theme') || 'dark';
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0E1218';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#DFDDD6';
          }
          var l = localStorage.getItem('xmessenger_lang') || 'fa';
          document.documentElement.lang = l;
          document.documentElement.dir = (l === 'fa') ? 'rtl' : 'ltr';
          var m = document.querySelectorAll('meta[name="theme-color"]');
          m.forEach(function(el) { el.setAttribute('content', t === 'dark' ? '#0E1218' : '#DFDDD6'); });
        } catch (e) {}
      })();
    </script>
