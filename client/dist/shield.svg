<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141A23"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>

    <!-- Cyan Electric Wing Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Warm Golden Amber Wing Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Titanium Center Glow -->
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0EA5E9" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base with hairline border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Dynamic Geometric 'X' Messenger Emblem -->
  <!-- Wing 1 (Top-Left to Bottom-Right Cyan Aerodynamic Blade) -->
  <path d="M34 32 L54 32 L94 96 L74 96 Z" fill="url(#cyanGrad)" filter="url(#softGlow)"/>

  <!-- Wing 2 (Top-Right to Bottom-Left Golden Amber Blade) -->
  <path d="M94 32 L74 32 L34 96 L54 96 Z" fill="url(#amberGrad)" opacity="0.94"/>

  <!-- Supersonic Paper Plane Center Keel in Titanium White -->
  <path d="M64 26 L76 64 L64 57 L52 64 Z" fill="url(#centerGrad)"/>
</svg>
